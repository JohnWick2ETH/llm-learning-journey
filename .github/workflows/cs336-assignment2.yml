name: CS336 Assignment 2

on:
  push:
    paths:
      - "cs336/assignment2-systems/**"
      - ".github/workflows/cs336-assignment2.yml"
  pull_request:
    paths:
      - "cs336/assignment2-systems/**"
      - ".github/workflows/cs336-assignment2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cs336-assignment2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cs336/assignment2-systems

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: cs336/assignment2-systems
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Run benchmark for 'forward' workload
        run: |
          uv run --frozen python bin/benchmark.py \
          --hyperparam bin/hyperparam.json \
          --size small \
          --workload forward \
          --warmup_steps 5