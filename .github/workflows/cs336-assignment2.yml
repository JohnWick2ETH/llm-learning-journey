name: CS336 Assignment 2

on:
  push:
    paths:
      - "cs336/assignment1-basics/**"
      - "cs336/assignment2-systems/**"
      - ".github/workflows/cs336-assignment2.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cs336-assignment2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu-smoke:
    name: GPU smoke test (Python 3.12, RTX 3090)
    # Do not add pull_request_target or untrusted pull_request triggers here.
    # This repository is public and this job runs on a machine on the local network.
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cs336/assignment2-systems

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          working-directory: cs336/assignment2-systems
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify CUDA is available
        run: |
          nvidia-smi
          uv run --frozen python - <<'PY'
          import torch

          assert torch.cuda.is_available(), "PyTorch cannot access CUDA"
          assert torch.cuda.device_count() > 0, "No CUDA devices are visible"
          print(f"PyTorch {torch.__version__}")
          print(f"CUDA {torch.version.cuda}")
          print(f"GPU {torch.cuda.get_device_name(0)}")
          PY
